    <style>
        :root {

            --sand-bg: #F8F6F0;
            --saffron: #E85D04;
            --gold: #F48C06;
            --white: #FFFFFF;
            --ink: #1E293B;
            --muted: #475569;
            --border: #E2E8F0;
            --wa: #16A34A;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--white); color: var(--ink); line-height: 1.65; }
        body.lang-en .hi { display: none; }
        body.lang-hi .en { display: none; }

        /* Top Announcement Strip */
        .top-bar { background: var(--forest); color: #FEF3C7; text-align: center; padding: 7px 15px; font-size: 0.85rem; font-weight: 500; }

        /* Header */
        header { background: var(--white); box-shadow: 0 2px 15px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); }
        .navbar { max-width: 1200px; margin: auto; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .logo { font-size: 1.35rem; font-weight: 700; color: var(--forest); display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--saffron); }
        .nav-links { display: flex; gap: 18px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--ink); font-weight: 600; font-size: 0.92rem; transition: 0.2s; }
        .nav-links a:hover { color: var(--saffron); }
        .lang-btn { background: var(--sand-bg); color: var(--forest); border: 1.5px solid var(--forest); padding: 6px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .lang-btn:hover { background: var(--forest); color: var(--white); }
        .menu-toggle { display: none; font-size: 1.5rem; cursor: pointer; color: var(--forest); }

        /* Professional Hero Section */
        .hero { background: linear-gradient(90deg, rgba(27, 67, 50, 0.92) 0%, rgba(27, 67, 50, 0.72) 100%), url('https://unsplash.com') center/cover no-repeat; color: var(--white); text-align: center; padding: 110px 20px; }
        .hero-tag { display: inline-block; background: rgba(244, 140, 6, 0.25); border: 1px solid #F48C06; color: #FDE68A; padding: 5px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; }
        .hero h1 { font-size: 2.5rem; margin-bottom: 14px; color: var(--white); line-height: 1.25; }
        .hero p { font-size: 1.15rem; max-width: 700px; margin: 0 auto 30px; color: #E2E8F0; }
        .btn-primary { background: var(--saffron); color: var(--white); padding: 14px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem; display: inline-block; border: none; cursor: pointer; transition: 0.25s; box-shadow: 0 4px 12px rgba(232, 93, 4, 0.3); }
        .btn-primary:hover { background: #DC2F02; transform: translateY(-2px); }

        /* Sections */
        section { padding: 70px 20px; max-width: 1200px; margin: auto; }
        .section-title { text-align: center; margin-bottom: 42px; }
        .section-title h2 { font-size: 2rem; color: var(--forest); margin-bottom: 10px; font-weight: 700; }
        .section-title p { color: var(--muted); max-width: 660px; margin: auto; font-size: 1rem; }
        .bg-sage { background-color: var(--sage-bg); max-width: 100%; border-top: 1px solid #D8E8DD; border-bottom: 1px solid #D8E8DD; }
        .bg-sand { background-color: var(--sand-bg); max-width: 100%; border-top: 1px solid #EAE5D9; border-bottom: 1px solid #EAE5D9; }
        .inner { max-width: 1200px; margin: auto; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 24px; }
        .card { background: var(--white); padding: 26px; border-radius: 12px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05); border: 1px solid var(--border); transition: 0.25s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(15, 23, 42, 0.09); }

        .stat-card { text-align: center; border-top: 4px solid var(--saffron); }
        .stat-card h3 { font-size: 2.2rem; color: var(--forest); }
        .stat-card p { font-weight: 600; color: var(--ink); }

        .team-card { padding: 0 0 20px; text-align: center; overflow: hidden; }

        .team-card h4 { margin-top: 14px; font-size: 1.1rem; }

        .badge { background: var(--white); color: var(--forest); border: 1.5px solid var(--forest); padding: 8px 18px; border-radius: 30px; font-size: 0.88rem; font-weight: 600; }

        .product-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 210px; object-fit: cover; }
        .product-info { padding: 20px; }
        .price-weight { display: flex; justify-content: space-between; font-weight: 700; color: var(--saffron); margin: 8px 0; font-size: 1.1rem; }
        .ingredients { font-size: 0.85rem; color: var(--muted); margin-bottom: 15px; }
        .btn-wa { background: var(--wa); color: var(--white); text-decoration: none; padding: 11px 14px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 0.95rem; }
        .btn-wa:hover { background: #15803D; }
        .bulk-box { text-align: center; margin-top: 36px; background: var(--white); padding: 26px; border-radius: 12px; border: 1.5px dashed var(--saffron); }

        .hamper-card { border-left: 5px solid var(--saffron); }
        .reel-card { position: relative; border-radius: 12px; overflow: hidden; height: 330px; background: #0F172A; }
        .reel-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .reel-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(15, 23, 42, 0.92)); color: var(--white); padding: 18px; }
        .reel-overlay h4 { color: var(--white); }
        .play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.8rem; color: #FDE68A; }

        .cert-bar { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 20px; background: var(--sand-bg); padding: 26px; border-radius: 12px; margin-bottom: 32px; text-align: center; border: 1px solid #EAE5D9; }
        .cert-item i { font-size: 2rem; color: var(--forest); margin-bottom: 6px; }
        .event-card { border-top: 4px solid var(--forest); }
        .event-date { color: var(--saffron); font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; }
        .form-group { margin-bottom: 12px; }
        .form-group input { width: 100%; padding: 11px 14px; border: 1px solid #CBD5E1; border-radius: 8px; color: var(--ink); background: var(--sand-bg); font-size: 0.95rem; }

        .faq-item { background: var(--white); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .faq-question { padding: 16px 20px; font-weight: 600; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--forest); }
        .faq-answer { padding: 0 20px; max-height: 0; overflow: hidden; transition: 0.3s ease; color: var(--muted); }
        .faq-item.active .faq-answer { padding: 14px 20px; max-height: 180px; border-top: 1px solid var(--border); }

        footer { background: var(--forest); color: var(--white); padding: 60px 20px 20px; }

        .social-icons { display: flex; gap: 15px; margin-top: 14px; font-size: 1.4rem; }
        .copyright { text-align: center; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 18px; font-size: 0.85rem; color: #CBD5E1; }
        .sticky-wa { position: fixed; bottom: 20px; right: 20px; background: var(--wa); color: var(--white); padding: 13px 22px; border-radius: 50px; font-weight: 600; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 8px; z-index: 9999; }

        @media (max-width: 850px) {
            .menu-toggle { display: block; }
            .nav-links { display: none; width: 100%; flex-direction: column; padding-top: 15px; }
            .nav-links.active { display: flex; }
