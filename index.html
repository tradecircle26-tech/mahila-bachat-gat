    <script>
        // Apne Bachat Gat ka asli WhatsApp number yahan dalein (91 ke saath, bina + ke)
        const WHATSAPP_NUMBER = "919876543210";
        let currentLang = 'hi';

        // 1. Hindi / English Language Toggle
        function toggleLanguage() {
            const hiElements = document.querySelectorAll('.lang-hi');
            const enElements = document.querySelectorAll('.lang-en');

            if (currentLang === 'hi') {
                hiElements.forEach(el => el.classList.add('hidden'));
                enElements.forEach(el => el.classList.remove('hidden'));
                currentLang = 'en';
            } else {
                enElements.forEach(el => el.classList.add('hidden'));
                hiElements.forEach(el => el.classList.remove('hidden'));
                currentLang = 'hi';
            }
        }

        // 2. Mobile Menu Toggle
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        // Menu link par click karne par mobile menu apne aap band ho jaye
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        // 3. Direct WhatsApp Product Order
        function orderOnWhatsApp(productName, price) {
            const message = `Namaste Annapurna Mahila Bachat Gat! 🙏%0A%0AMujhe ye product order karna hai:%0A*Product:* ${productName}%0A*Price:* ${price}%0A*Quantity:* 1%0A%0AKripya delivery details aur payment link batayein.`;
            window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${message}`, '_blank');
        }

        // 4. Bulk / Gift Hamper Inquiry on WhatsApp
        function orderBulk(itemName) {
            const message = `Namaste! 🙏%0A%0AMujhe *${itemName}* ke liye Bulk / Custom Gift Hamper order ki jaankari aur wholesale rate chahiye.`;
            window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${message}`, '_blank');
        }

        // 5. FAQ Accordion (Sawal-Jawab kholne aur band karne ke liye)
        function toggleFaq(button) {
            const answer = button.nextElementSibling;
            const icon = button.querySelector('span');
            
            if (answer.style.display === 'block') {
                answer.style.display = 'none';
                icon.textContent = '+';
            } else {
                answer.style.display = 'block';
                icon.textContent = '-';
            }
        }

        // 6. Join Us / Retailer Form Submission (Direct WhatsApp par bhejta hai)

            const phone = inputs[1].value;
            const extra = inputs[2].value;

            const message = `Namaste! 🙏%0A%0ANaya *${formType}* aavedan:%0A*Naam/Dukaan:* ${name}%0A*Mobile:* ${phone}%0A*Details/City:* ${extra}`;
            
            alert(`Dhanyawad ${name}! Aapki jaankari WhatsApp par bheji ja rahi hai.`);
            window.open(`https://wa.me{WHATSAPP_NUMBER}?text=${message}`, '_blank');
            event.target.reset();
        }
    </script>
</body>
